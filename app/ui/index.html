<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121722" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agents">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Agents</title>
<style>
:root {
  --paper: #EEF1F5;
  --surface: #FFFFFF;
  --surface-2: #F6F8FB;
  --ink: #17202E;
  --muted: #5B6676;
  --line: #D9DEE6;
  --cobalt: #2450D3;
  --cobalt-ink: #FFFFFF;
  --amber: #E3A008;
  --amber-soft: #FFF4D6;
  --danger: #C2362B;
  --shadow: 0 1px 2px rgba(23, 32, 46, .08);
  --radius-bubble: 16px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-head: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #121722; --surface: #1A2130; --surface-2: #202939; --ink: #E6EAF1; --muted: #98A2B3;
    --line: #2C3546; --cobalt: #4C74F0; --amber: #F2B53A; --amber-soft: #3A2F14; --danger: #F0645A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
[hidden] { display: none !important; }

/* ---------- login ---------- */
.login { min-height: 100%; display: grid; place-items: center; padding: 24px; }
.login form { width: min(360px, 100%); background: var(--surface); border-radius: 20px; padding: 28px; box-shadow: var(--shadow); }
.login h1 { font: 600 22px/1.2 var(--font-head); margin: 0 0 6px; }
.login p { margin: 0 0 20px; color: var(--muted); }
.login input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.login .err { color: var(--danger); min-height: 1.4em; margin: 8px 0 0; font-size: 14px; }

/* ---------- shell ---------- */
.app { display: flex; height: 100dvh; }
.side { width: 340px; flex: none; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side-head { display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px; min-height: 60px; }
.side-head h1 { font: 650 22px/1 var(--font-head); margin: 0; flex: 1; letter-spacing: -.01em; }
.icon-btn { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.search { margin: 4px 16px 10px; }
.search input { width: 100%; border: 0; background: var(--surface-2); border-radius: 10px; padding: 9px 12px; }
.list { overflow-y: auto; flex: 1; padding: 0 8px 12px; }
.row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; width: 100%; border: 0; background: transparent; text-align: left; padding: 9px 8px; border-radius: 12px; }
.row:hover { background: var(--surface-2); }
.row[aria-current="true"] { background: color-mix(in srgb, var(--cobalt) 10%, transparent); }
.row .name { font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
.row .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .preview { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .when { color: var(--muted); font-size: 12px; align-self: start; padding-top: 3px; }
.row.off .name, .row.off .preview { opacity: .55; }
.badge { background: var(--amber); color: #1D1500; border-radius: 999px; font-size: 12px; font-weight: 700; min-width: 22px; height: 22px; padding: 0 7px; display: inline-grid; place-items: center; }
.side-foot { border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
.signout { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; color: var(--muted); padding: 8px 10px; border-radius: 10px; font-size: 14px; }
.signout:hover { background: var(--surface-2); color: var(--ink); }
.divider { height: 1px; background: var(--line); margin: 6px 12px; }

.avatar { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font: 650 16px/1 var(--font-head); color: #fff; background: var(--hue, #777); position: relative; flex: none; }
.avatar.sm { width: 32px; height: 32px; border-radius: 10px; font-size: 13px; }
.avatar.xs { width: 24px; height: 24px; border-radius: 8px; font-size: 11px; }
.avatar.you { background: var(--cobalt); }
.avatar.approvals { background: var(--amber); color: #1D1500; }
.members { display: flex; flex-direction: column; gap: 2px; max-height: 340px; overflow-y: auto; }
.members label { display: grid; grid-template-columns: auto auto 1fr; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 10px; cursor: pointer; }
.members label:hover { background: var(--surface-2); }
.members input { width: 18px; height: 18px; accent-color: var(--cobalt); margin: 0; }
.members label:has(input:disabled) { cursor: default; }
.members .desc { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
textarea.field { resize: vertical; min-height: 140px; line-height: 1.45; }
.field-hint { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }
.avatar .live-dot { position: absolute; right: -3px; bottom: -3px; width: 13px; height: 13px; border-radius: 50%; background: #2BB673; border: 2.5px solid var(--surface); }
.avatar .live-dot.waiting { background: var(--amber); }
@media (prefers-reduced-motion: no-preference) {
  .avatar .live-dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.75); } }
}

/* ---------- main pane ---------- */
.main { display: flex; flex-direction: column; flex: 1 1 0; min-width: 320px; min-height: 0; }
.app.side-collapsed .side { display: none; }
.side-toggle svg { display: block; }
/* the agent's browser, docked beside the chat; drag the bar between them to resize */
.split { flex: none; width: 7px; margin: 0 -3px; z-index: 2; cursor: col-resize; position: relative; touch-action: none; }
.split::after { content: ""; position: absolute; inset: 0 3px; background: var(--line); transition: background .15s; }
.split:hover::after, .split:focus-visible::after, .split.dragging::after { background: var(--cobalt); inset: 0 2px; }
.split:focus-visible { outline: none; }
body.resizing { cursor: col-resize; user-select: none; }
body.resizing .dock, body.resizing .main { pointer-events: none; }
.dock { flex: 0 1 var(--dock-w, 640px); min-width: 300px; background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); min-height: 64px; }
.chat-head .who { flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; padding: 0; }
.chat-head .title { font: 650 17px/1.2 var(--font-head); }
.chat-head .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back { display: none; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: 14px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--cobalt-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }

.scroll { flex: 1; overflow-y: auto; padding: 16px clamp(12px, 4vw, 48px) 8px; }
.stream { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.day { align-self: center; color: var(--muted); font-size: 12.5px; background: var(--surface); padding: 3px 10px; border-radius: 999px; margin: 10px 0 4px; box-shadow: var(--shadow); }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: min(640px, 88%); }
.msg.you { align-self: flex-end; flex-direction: row-reverse; }
.bubble { background: var(--surface); padding: 9px 13px; border-radius: var(--radius-bubble); border-bottom-left-radius: 6px; box-shadow: var(--shadow); min-width: 0; overflow-wrap: anywhere; }
.msg.you .bubble { background: var(--cobalt); color: var(--cobalt-ink); border-bottom-left-radius: var(--radius-bubble); border-bottom-right-radius: 6px; }
.bubble .meta { font-size: 11.5px; color: var(--muted); margin-top: 4px; display: flex; justify-content: flex-end; gap: 10px; }
.msg.you .bubble .meta { color: color-mix(in srgb, var(--cobalt-ink) 75%, transparent); }
.bubble.failed { box-shadow: inset 3px 0 0 var(--danger), var(--shadow); }
.bubble .task { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.bubble img { display: block; max-width: 100%; max-height: 320px; border-radius: 10px; margin: 2px 0 6px; }
.note { align-self: center; text-align: center; color: var(--muted); font-size: 13px; max-width: 560px; padding: 2px 8px; }

/* markdown inside bubbles */
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md table { margin: 0 0 .55em; }
.md ul, .md ol { padding-left: 1.25em; }
.md .h { display: block; font-weight: 700; margin: .5em 0 .25em; }
.md code { font: 13px var(--font-code); background: color-mix(in srgb, var(--ink) 8%, transparent); padding: 1px 5px; border-radius: 5px; }
.md pre { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; overflow-x: auto; }
.md pre code { background: none; padding: 0; font-size: 12.5px; }
.md table { border-collapse: collapse; font-size: 13.5px; display: block; overflow-x: auto; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 4px 10px 4px 0; text-align: left; vertical-align: top; }
.md a { color: inherit; text-underline-offset: 2px; }
.msg.you .md code { background: rgba(255,255,255,.18); }

/* typing / progress */
.typing { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; padding: 4px 2px; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--hue, var(--muted)); opacity: .5; }
@media (prefers-reduced-motion: no-preference) {
  .dots i { animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 40% { opacity: 1; transform: translateY(-2px); } }
}

/* composer */
.composer { background: var(--surface); border-top: 1px solid var(--line); padding: 10px clamp(12px, 4vw, 48px) calc(10px + env(safe-area-inset-bottom)); }
.composer-inner { max-width: 820px; margin: 0 auto; }
.attach-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.attach-list figure { margin: 0; position: relative; }
.attach-list img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; display: block; }
.attach-list button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--ink); color: var(--surface); font-size: 13px; line-height: 1; }
.compose-row { display: flex; align-items: flex-end; gap: 8px; }
.compose-row textarea { flex: 1; resize: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 10px 14px; max-height: 180px; min-height: 44px; line-height: 1.4; }
.send { width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--cobalt); color: #fff; display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .45; cursor: default; }

/* @agent / slash-command suggestions */
.composer-inner { position: relative; }
.suggest { position: absolute; left: 0; right: 0; bottom: calc(100% + 18px); z-index: 10; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 28px rgba(10, 14, 22, .18); padding: 6px; max-height: 280px; overflow-y: auto; }
.suggest-head { font-size: 12px; color: var(--muted); padding: 4px 8px 6px; }
.palette { padding: 0 0 8px; }
/* command modal: opens when "/" is typed in the search box */
.cmd { position: fixed; inset: 0; z-index: 25; display: flex; justify-content: center; align-items: flex-start; padding: clamp(16px, 12vh, 120px) 16px 16px; }
.cmd-scrim { position: absolute; inset: 0; background: rgba(10, 14, 22, .45); }
.cmd-box { position: relative; width: min(680px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 24px 60px rgba(10, 14, 22, .35); overflow: hidden; }
.cmd-box textarea { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; resize: none; padding: 18px 20px; font: 400 20px/1.4 var(--font); min-height: 64px; max-height: 220px; outline: none; }
.cmd-box .palette { overflow-y: auto; padding: 8px; min-height: 0; }
.cmd-foot { display: flex; gap: 14px; flex-wrap: wrap; border-top: 1px solid var(--line); padding: 8px 16px; color: var(--muted); font-size: 12px; }
.cmd-foot kbd { font: 600 11px var(--font-code); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
@media (max-width: 760px) { .cmd { padding-top: 12px; } .cmd-box textarea { font-size: 18px; } }
@media (pointer: coarse) { .cmd-foot { display: none; } }
/* iOS Safari zooms in on any focused field under 16px and stays zoomed: keep fields at 16px on touch screens. */
@media (pointer: coarse) { input, select, textarea { font-size: max(16px, 1em) !important; } }
:is(.suggest, .palette) button { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; width: 100%; border: 0; background: transparent; text-align: left; padding: 7px 8px; border-radius: 10px; }
:is(.suggest, .palette) button:hover { background: var(--surface-2); }
:is(.suggest, .palette) button[aria-selected="true"] { background: color-mix(in srgb, var(--cobalt) 12%, transparent); }
:is(.suggest, .palette) .label { font-weight: 600; font-family: var(--font-code); font-size: 13.5px; }
:is(.suggest, .palette) .label small { font-weight: 400; color: var(--muted); }
:is(.suggest, .palette) .desc { grid-column: 2; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
:is(.suggest, .palette) .slash { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font: 600 14px var(--font-code); grid-row: span 2; }
:is(.suggest, .palette) .avatar { grid-row: span 2; }
.local { align-self: stretch; max-width: 640px; background: var(--surface-2); border: 1px dashed var(--line); border-radius: var(--radius-bubble); padding: 10px 14px; }
.local .meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; }

/* a suggestion waiting for you, shown under the reply that made it */
.ask { align-self: flex-start; margin-left: 40px; width: min(520px, calc(100% - 40px)); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 14px; border-left: 4px solid var(--amber); }
.ask.done { border-left-color: var(--line); }
.ask-title { font-weight: 650; }
.ask-line { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.ask .actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.ask-status { font-size: 13.5px; font-weight: 600; color: var(--muted); }
.ask-status.approved { color: #2BB673; }
/* a login an agent asked for: typed here, sent straight to the vault */
.lf { display: grid; gap: 4px; margin-top: 10px; font-size: 13.5px; font-weight: 600; }
.lf code, .login-row code { font: 12px var(--font-code); color: var(--muted); font-weight: 400; }
.lf-allow { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 13.5px; }
.lf-allow input { width: 18px; height: 18px; accent-color: var(--cobalt); margin: 0; }
.login-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.login-row:first-of-type { border-top: 0; }
.login-row .desc { color: var(--muted); font-size: 13px; }
.login-row .row-actions { display: flex; gap: 6px; grid-row: span 2; flex-wrap: wrap; justify-content: flex-end; }
.login-row .replace { grid-column: 1 / -1; display: flex; gap: 8px; }
.chip.site { display: inline-flex; align-items: center; gap: 2px; }
.grants { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.grants label { display: inline-flex; gap: 5px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; color: var(--ink); cursor: pointer; }
.grants label:has(input:checked) { border-color: var(--cobalt); background: color-mix(in srgb, var(--cobalt) 10%, transparent); }
.grants input { margin: 0; accent-color: var(--cobalt); }
.chip.site button { border: 0; background: none; color: var(--muted); padding: 0 2px; font-size: 12px; line-height: 1; }
.chip.site button:hover { color: var(--danger); }
/* an agent waiting mid-run (a tool to allow, an OK, its browser), and tasks it delegated */
.ask details { margin-top: 8px; }
.ask summary { cursor: pointer; color: var(--muted); font-size: 13.5px; }
.ask pre.details { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font: 12px/1.4 var(--font-code); max-height: 220px; overflow: auto; margin: 6px 0 0; }
.ask .md { margin-top: 6px; font-size: 14px; }
.ask .note-in { margin-top: 10px; }
.ask.task { border-left-color: var(--cobalt); }
.ask.task.done { border-left-color: var(--line); }
.ask-status.working { color: var(--cobalt); }

/* activity (audit log) */
.avatar.activity { background: var(--cobalt); }
.activity { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 2px; }
.activity .day { margin-top: 14px; }
.ev { display: grid; grid-template-columns: 64px 8px 1fr; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 10px; font-size: 14px; background: var(--surface); }
.ev time { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ev i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); align-self: center; }
.ev .txt { overflow-wrap: anywhere; min-width: 0; }
.ev.k-run i { background: #2BB673; } .ev.k-ask i { background: var(--amber); } .ev.k-key i { background: var(--danger); }
.ev.k-task i, .ev.k-hook i { background: var(--cobalt); } .ev.k-mem i { background: #9B6BD6; }
.activity-filter { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 6px 10px; max-width: 46%; }
.act-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
.act-bar .field { flex: 1 1 180px; width: auto; padding: 7px 10px; }
.act-bar .activity-filter { max-width: none; }
.ev.open-able { cursor: pointer; }
.ev.open-able:hover { background: var(--surface-2); }
.ev .txt .line { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ev .txt b { font-weight: 650; }
.ev .txt .tag { color: var(--muted); font-size: 12.5px; margin-right: 6px; }
.ev .txt .run { border: 0; background: none; color: var(--cobalt); font-size: 12.5px; padding: 0 0 0 6px; }
.ev .txt pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font: 12.5px/1.45 var(--font-code); margin: 6px 0 2px; max-height: 420px; overflow: auto; cursor: text; }
.ev.k-tool i { background: var(--cobalt); } .ev.k-good i { background: #2BB673; } .ev.k-bad i { background: var(--danger); } .ev.k-think i { background: #9B6BD6; }
.ev.sub { padding-left: 26px; color: var(--muted); }
.radio-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
/* interactions: each run start to finish */
.segs { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
.seg { border: 0; background: var(--surface-2); color: var(--muted); padding: 6px 11px; font-size: 13.5px; }
.seg.on { background: var(--cobalt); color: var(--cobalt-ink); }
.pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12.5px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.good { background: rgba(43,182,115,.14); color: #1d7f50; } .pill.bad { background: rgba(194,54,43,.12); color: var(--danger); }
.pill.warn { background: var(--amber-soft); color: #8a5d00; } .pill.live { background: rgba(36,80,211,.12); color: var(--cobalt); }
.bad-t { color: var(--danger); }
.irow { display: grid; grid-template-columns: 36px 1fr; gap: 12px; text-align: left; width: 100%; border: 1px solid var(--line); border-left: 4px solid var(--line);

// Small, safe markdown: escape first, then a few constructs.

      const code = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) code.push(lines[i++]);
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      i--;
      const cells = (r) => r.trim().slice(1, -1).split("|").map((c) => c.trim());
      const body = rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<table>${body.map((r, n) => `<tr>${cells(r).map((c) => n === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table>`);
      continue;
    }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(line)) {
      const ordered = /^\s*\d/.test(line); const items = [];
      while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*•]|\d+[.)])\s+/, ""));
      i--;
      out.push(`<${ordered ? "ol" : "ul"}>${items.map((t) => `<li>${inline(t)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`); continue;
    }
    const head = line.match(/^#{1,6}\s+(.*)/);
    if (head) { out.push(`<span class="h">${inline(head[1])}</span>`); continue; }
    if (!line.trim()) { out.push(""); continue; }
    const para = [line];
    while (i + 1 < lines.length && lines[i + 1].trim() && !/^(```|#{1,6}\s|\s*\||\s*([-*•]|\d+[.)])\s)/.test(lines[i + 1])) para.push(lines[++i]);
    out.push(`<p>${para.map(inline).join("<br>")}</p>`);
  }
  const div = h("div", { class: "md" }); div.innerHTML = out.join(""); return div;
}

const PAGE = 60; // messages the server sends at a time: a chat opens with the latest, "Show earlier messages" gets the ones before
const chatOpen = () => S.view?.kind === "agent" || S.view?.kind === "group";
const chatUrl = (v) => v.kind === "agent" ? `/api/chats/${v.name}/messages` : `/api/groups/${v.id}/messages`;
// The open chat again from the server (a task under a reply moved on, or the connection was down for a while):
// what changed is redrawn and what's new is added, message by message.
async function reloadMessages() {
  const v = S.view;
  if (!chatOpen()) return;
  const r = await api("GET", chatUrl(v));
  if (S.view !== v) return;
  const newest = Math.max(0, ...S.messages.map((m) => (typeof m.id === "number" ? m.id : 0)));
  for (const m of r.messages) {
    const i = S.messages.findIndex((x) => x.id === m.id);
    if (i < 0) { if (m.id > newest) appendMessage(m); }
    else if (JSON.stringify(S.messages[i]) !== JSON.stringify(m)) { S.messages[i] = m; redrawMessage(m); }
  }
}
// The messages before the ones shown.
async function loadOlder(btn) {

    if (S.view !== v) return;

// ---------------- chat ----------------
function messageNode(m) {
  if (m.role === "system") return h("div", { class: "note" }, m.text);
  if (m.role === "local") return h("div", { class: "local" }, md(m.text), h("div", { class: "meta" }, "Only you can see this"));
  const mine = m.role === "human";
  const bubble = h("div", { class: `bubble${m.meta?.ok === false ? " failed" : ""}` });
  if (m.meta?.task) bubble.append(h("div", { class: "task" }, m.meta.webhook ? `Webhook “${m.meta.webhook}”`
    : m.meta.taskFrom ? `Task #${m.meta.taskId} from ${labelOf(m.meta.taskFrom)}` : m.meta.tasks?.length ? "Delegated tasks came back"
    : m.meta.scheduled ? "Scheduled task" : "Task run"));
  for (const a of m.attachments ?? []) bubble.append(h("a", { href: a.url, target: "_blank" }, h("img", { src: a.url, alt: "Attached photo", loading: "lazy" })));
  if (m.text) bubble.append(mine ? h("div", { class: "md" }, ...m.text.split("\n").flatMap((l, i) => i ? [h("br"), l] : [l])) : md(m.text));
  const s = m.meta?.session; // 5-hour session limit after this run (Claude only; older messages have none)
  const usage = s ? `${Math.round(s.used * 100)}% of session${s.resetsAt ? `, resets ${timeOf(s.resetsAt * 1000)}` : ""}`
    : EFFORT_LABEL[m.meta?.effort]?.toLowerCase() ?? m.meta?.effort;
  const how = !mine && m.meta?.model
    ? h("span", {}, `${modelLabel(m.meta.model)}, ${usage}${m.meta.turns ? `, ${m.meta.turns} turns` : ""}`) : null;
  bubble.append(h("div", { class: "meta" }, how, h("time", {}, timeOf(m.created_at))));
  const node = h("div", { class: `msg${mine ? " you" : ""}` }, mine ? null : avatar(m.author, "sm"), bubble);
  const cards = [...(m.proposals ?? []).map(proposalCard), ...(m.logins ?? []).map(loginCard), ...(m.actions ?? []).map(actionCard), ...(m.tasks ?? []).map(taskCard)];
  return cards.length ? [node, ...cards] : node;
}

function withDays(items, dateKey, render) {
  const nodes = []; let lastDay = null;
  for (const it of items) {
    const d = dayOf(it[dateKey]);
    if (d !== lastDay) { nodes.push(h("div", { class: "day" }, d)); lastDay = d; }
    nodes.push(...[render(it)].flat());
  }
  return nodes;
}

// A message's nodes (its bubble, then any cards under it), tagged so one message can be redrawn by itself.
const nodesOf = (m) => [messageNode(m)].flat().map((n) => { n.dataset.mid = m.id; return n; });

// The whole chat: when it opens, or earlier messages were loaded (keepPlace: stay where you were reading).
// After that, messages are added or redrawn one at a time (appendMessage, redrawMessage), so an update
// doesn't move what you're reading or clear what you're typing into a card.
function renderMessages({ keepPlace = false } = {}) {
  const stream = $("#stream"), sc = $("#scroll"), fromEnd = sc.scrollHeight - sc.scrollTop;
  if (!S.messages.length && S.view.kind === "group") {
    stream.replaceChildren(h("div", { class: "empty" }, h("h2", {}, "Say hi to the group"),
      h("p", {}, `Everyone here gets every message you send and answers in turn: ${curGroup()?.members.join(", ")}.`)));
  } else if (!S.messages.length) {
    const a = S.agents.find((x) => x.name === S.view.name);
    stream.replaceChildren(h("div", { class: "empty" }, h("h2", {}, `Say hi to ${labelOf(a.name)}`),
      h("p", {}, a.description || "Ask it anything within its job."), a.schedule ? h("p", {}, `It also runs by itself: ${cronText(a.schedule).toLowerCase()}. Results land here.`) : null));
  } else {
    const older = S.older ? h("button", { class: "btn", style: "align-self:center;margin:4px 0 8px", onclick: (e) => loadOlder(e.target) }, "Show earlier messages") : null;
    stream.replaceChildren(...[older, ...withDays(S.messages, "created_at", nodesOf)].filter(Boolean));
  }
  renderTyping();
  if (keepPlace) sc.scrollTop = sc.scrollHeight - fromEnd; else scrollDown();
}
// A new message at the end. The view follows it only if you were at the bottom (or it's your own).
function appendMessage(m) {
  const follow = atBottom() || m.role === "human" || m.role === "local", prev = S.messages.at(-1);
  S.messages.push(m);
  if (!prev) return renderMessages(); // the first one replaces the "Say hi" text
  const stream = $("#stream");
  $("#typing")?.remove();
  if (dayOf(prev.created_at) !== dayOf(m.created_at)) stream.append(h("div", { class: "day" }, dayOf(m.created_at)));
  stream.append(...nodesOf(m));
  renderTyping();
  if (follow) scrollDown();
}
// One message again in place, e.g. a card under it changed.
function redrawMessage(m) {
  const old = [...$("#stream").children].filter((n) => n.dataset.mid === String(m.id));
  if (!old.length) return;
  old[0].before(...nodesOf(m));
  for (const n of old) n.remove();
}
// A card under a reply was decided (approved, answered, saved): mark it and redraw the replies that carry it.
function setCardStatus(kind, id, status) {
  for (const m of S.messages) {
    const hit = (m[kind] ?? []).filter((c) => c.id === id && c.status !== status);
    for (const c of hit) c.status = status;
    if (hit.length && chatOpen()) redrawMessage(m);
  }
}

function renderTyping() {
  $("#typing")?.remove();
  const name = S.view?.kind === "agent" ? S.view.name : null;
  const groupRunning = S.view?.kind === "group" ? (curGroup()?.members ?? []).filter((m) => S.running.has(m)) : [];
  const who = name && S.running.has(name) ? [name] : groupRunning;

    h("span", { class: "dots", "aria-hidden": "true" }, h("i"), h("i"), h("i")),
    who.map((n) => `${n} is ${S.progress[n] || "thinking"}`).join(", ")));
}
const scrollDown = () => { const s = $("#scroll"); s.scrollTop = s.scrollHeight; };
const atBottom = () => { const s = $("#scroll"); return s.scrollHeight - s.scrollTop - s.clientHeight < 80; };

async function send() {
  const text = $("#text").value.trim();
  if (!text && !S.attachments.length) return;
  const v = S.view;
  closeSuggest();
  if (/^\/[a-z]/i.test(text)) return runCommand(text);
  $("#send").disabled = true;
  try {
    if (v.kind === "agent") {
      await api("POST", `/api/chats/${v.name}/messages`, {
        text, attachments: S.attachments.map((a) => a.path),

    } else if (v.kind === "group") {
      await api("POST", `/api/groups/${v.id}/messages`, { text });
    }
    $("#text").value = ""; S.attachments = []; renderAttachments(); autosize();
  } catch (e) { toast(e.message); }
  updateSend();
}

function agentsText() {
  if (!S.agents.length) return "You have no agents yet. Use the button next to “Agents”, or ask `agent-architect` to design one.";
  return ["# Your agents", ...S.agents.map((a) =>
    `- **${a.name}**${a.enabled ? "" : " (off)"}: ${a.description || "No description"}. ${cronText(a.schedule)}.`)].join("\n");
}

async function runCommand(text) {
  const [, raw, arg = ""] = text.match(/^\/(\S+)\s*([\s\S]*)$/);
  const name = raw.toLowerCase();
  const cmd = commandsHere().find((c) => c.name === name);
  if (!cmd) {
    toast(COMMANDS.some((c) => c.name === name) ? `/${name} works in an agent's own chat.` : `Unknown command /${name}. Type /help to see the commands.`);
    return;
  }
  const a = S.view.kind === "agent" ? S.agents.find((x) => x.name === S.view.name) : null;
  if (cmd.name === "run" && !a.schedule) return toast(`${a.name} has no scheduled task. Just message it.`);
  if (cmd.name === "browser" && !a.browser) return toast(`${labelOf(a.name)} has no browser.`);
  $("#text").value = ""; autosize(); updateSend();
  switch (cmd.name) {
    case "help": return showLocal(helpText());
    case "agents": return showLocal(agentsText());
    case "approvals": return open({ kind: "approvals" });
    case "run": return runNow();
    case "memory":
      await openDrawer(a.name);
      return [...document.querySelectorAll(".drawer-body h4")].find((x) => x.textContent.startsWith("Memory"))?.scrollIntoView();
    case "browser": return openBrowserView(a.name);
    case "new": try { await api("POST", `/api/agents/${a.name}/reset`); } catch (e) { toast(e.message); } return;
  }
}

// ---------------- @agent suggestions ----------------
// What to suggest for the text before the caret ("@agent"). Commands ("/...") open the floating command box.
function suggestionsAtCaret() {
  const t = $("#text"), before = t.value.slice(0, t.selectionStart), v = S.view?.kind;
  if (!v || v === "approvals" || t.selectionStart !== t.selectionEnd) return null;
  let m;
  if ((m = before.match(/(^|\s)@([a-z0-9-]*)$/i))) {
    const q = m[2].toLowerCase(), on = S.agents.filter((a) => a.enabled && a.name !== S.view.name);
    const ranked = [...on.filter((a) => a.name.startsWith(q)), ...on.filter((a) => !a.name.startsWith(q) && a.name.includes(q))];
    return { title: "Agents", from: before.length - m[2].length - 1, empty: q ? `No agent matches “@${q}”` : "No agents are turned on",
      items: ranked.map((a) => ({ label: `@${a.name}`, agent: a.name, desc: a.description || cronText(a.schedule), insert: `@${a.name} ` })) };
  }
  return null;
}
function updateSuggest() {
  const s = suggestionsAtCaret();

}
function renderSuggest() {
  const box = $("#suggest"), s = S.sug;
  box.hidden = false;
  box.replaceChildren(h("div", { class: "suggest-head" }, s.items.length ? s.title : s.empty ?? "Nothing matches"),
    ...s.items.map((it, i) => h("button", { type: "button", role: "option", id: `sug-${i}`, "aria-selected": i === s.index ? "true" : "false", onclick: () => pickSuggest(i) },
      it.agent ? avatar(it.agent, "xs") : h("span", { class: "slash", "aria-hidden": "true" }, it.icon),
      h("span", { class: "label" }, it.label, it.hint ? h("small", {}, ` ${it.hint}`) : null),
      h("span", { class: "desc" }, it.desc))));
  if (s.items.length) $("#text").setAttribute("aria-activedescendant", `sug-${s.index}`);
  else $("#text").removeAttribute("aria-activedescendant");
  box.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: "nearest" });
}
function closeSuggest() { S.sug = null; $("#suggest").hidden = true; $("#text").removeAttribute("aria-activedescendant"); }
function pickSuggest(i, complete = false) {
  const it = S.sug.items[i], t = $("#text");
  const head = t.value.slice(0, S.sug.from) + it.insert;
  const rest = t.value.slice(t.selectionStart).replace(/^[a-z0-9-]*/i, "");
  t.value = head + (head.endsWith(" ") ? rest.replace(/^\s+/, "") : rest);
  t.setSelectionRange(head.length, head.length); t.focus();
  autosize(); updateSend();
  if (it.submit && !complete) { closeSuggest(); send(); } else updateSuggest();
}

// ---------------- attachments ----------------
async function downscale(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = h("canvas", { width: Math.round(bmp.width * scale), height: Math.round(bmp.height * scale) });
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
}
async function addFiles(files) {
  for (const f of [...files].slice(0, 5 - S.attachments.length)) {

      S.attachments.push({ ...up, preview: URL.createObjectURL(blob) });

  }
  renderAttachments(); updateSend();
}

// request_device_key: the key of a device an agent can reach, given right here. The value goes straight to the LAN
// gateway (encrypted there), never into the chat; the agent only learns that it's there.
function deviceKeyCard(r, { withAgent = false } = {}) {
  const who = labelOf(r.agent), open = r.status === "open";
  let d = {};
  try { d = JSON.parse(r.details ?? "{}"); } catch { /* an old request */ }
  const ssh = d.kind === "ssh";
  const title = ssh ? `${who} needs an SSH key for ${d.name ?? "a device"}` : `${who} needs the ${d.label ?? "key"} of ${d.name ?? "a device"}`;
  const style = withAgent ? "margin-left:0;width:100%" : null;
  if (!open) return h("div", { class: "ask done", style }, h("div", { class: "ask-title" }, title),
    h("div", { class: "actions" }, h("span", { class: `ask-status${r.status === "allowed" ? " approved" : ""}` },
      r.status === "allowed" ? "✓ Saved in the gateway" : ACTION_DONE[r.status] ?? r.status)));
  const finish = async (btn, fn) => {
    btn.disabled = true;
    try {
      if (fn) await fn();
      await api("POST", `/api/actions/${r.id}/allow`, { note: "" });
      setActionStatus(r.id, "allowed"); toast(`Saved. ${who} carries on in a moment.`); loadState();
    } catch (e) { toast(e.message); btn.disabled = false; }
  };
  const deny = h("button", { class: "btn", onclick: async (e) => {
    e.target.disabled = true;

    catch (err) { toast(err.message); e.target.disabled = false; }
  } }, "Not now");
  const head = [h("div", { class: "ask-title" }, title),
    h("div", { class: "ask-line" }, h("code", {}, d.address ?? ""), d.why ? ` · ${d.why}` : "")];
  const foot = h("div", { class: "ask-line", style: "margin-top:8px" },
    `Goes straight to the network gateway, encrypted. ${who} never sees it. It waits until ${timeOf(r.expiresAt)}.`);
  if (!ssh) {
    const value = h("input", { class: "field", type: "password", autocomplete: "off", placeholder: d.label ?? "Key",
      onkeydown: (e) => { if (e.key === "Enter") save.click(); } });
    const save = h("button", { class: "btn primary", onclick: () => value.value && finish(save,
      () => api("PUT", `/api/lan/targets/${d.target}/credential`, { value: value.value, header: d.header, format: d.format })) }, "Save");
    return h("div", { class: "ask", style }, ...head, value,
      h("div", { class: "by", style: "margin-top:4px" }, `Sent as ${d.header}: ${String(d.format ?? "{}").replace("{base64}", "{} (base64)").replace("{}", "…")}`),
      foot, h("div", { class: "actions" }, deny, save));
  }
  // SSH: the gateway makes a key (or takes yours); you add its public half to the device, then hand it back.
  const user = h("input", { class: "field", maxlength: "32", autocomplete: "off", spellcheck: "false", placeholder: "User on the device, e.g. admin", value: d.user ?? "" });
  const pub = h("div", { hidden: true });
  const done = h("button", { class: "btn primary", hidden: true, onclick: () => finish(done) }, "Done, I added it");
  const showKey = (t) => {
    pub.replaceChildren(h("div", { class: "by" }, `Add this public key to ${d.name}'s authorized keys (user ${t.ssh.user}):`),
      h("div", { class: "hook-url" }, h("code", { style: "overflow-wrap:anywhere" }, t.ssh.publicKey),
        h("button", { class: "btn sm", onclick: () => navigator.clipboard?.writeText(t.ssh.publicKey).then(() => toast("Copied"), () => toast("Select it and copy it")) }, "Copy")));
    pub.hidden = false; done.hidden = false; make.textContent = "Make a new key";
  };
  const make = h("button", { class: "btn", onclick: async () => {
    make.disabled = true;
    try { showKey((await api("PUT", `/api/lan/targets/${d.target}/ssh`, { user: user.value.trim(), generate: true })).target); }
    catch (e) { toast(e.message); }
    make.disabled = false;
  } }, "Make a key");
  const own = h("textarea", { class: "field", rows: "4", spellcheck: "false", autocomplete: "off", style: "font:12px/1.4 var(--font-code);width:100%",
    placeholder: "-----BEGIN OPENSSH PRIVATE KEY-----\n…\n-----END OPENSSH PRIVATE KEY-----" });
  const useOwn = h("button", { class: "btn sm", onclick: () => own.value.trim() && finish(useOwn,
    () => api("PUT", `/api/lan/targets/${d.target}/ssh`, { user: user.value.trim(), key: own.value })) }, "Use this key");
  return h("div", { class: "ask", style }, ...head, user, pub,
    h("details", {}, h("summary", { class: "by", style: "cursor:pointer" }, "Or use a key of your own (no passphrase)"),
      h("div", { style: "display:grid;gap:8px;margin-top:6px" }, own, h("div", { style: "display:flex;justify-content:flex-end" }, useOwn))),
    foot, h("div", { class: "actions" }, deny, make, done));
}

  if (isIOS() && !isInstalled()) return "On iPhone and iPad, notifications work in the installed app: tap Share → Add to Home Screen, open Agents from the Home Screen, and turn them on there.";
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return "This browser doesn't support push notifications.";
  if (Notification.permission === "denied") return "Notifications are blocked for this site. Allow them in the browser's site settings, then come back.";
  return null;
}
function platformName() {
  const ua = navigator.userAgent;
  const os = /iPhone/.test(ua) ? "iPhone" : isIOS() ? "iPad" : /Android/.test(ua) ? "Android" : /Mac/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : /Linux/.test(ua) ? "Linux" : "";
  const app = /Edg\//.test(ua) ? "Edge" : /Firefox|FxiOS/.test(ua) ? "Firefox" : /Chrome|CriOS/.test(ua) ? "Chrome" : /Safari/.test(ua) ? "Safari" : "Browser";
  return isIOS() && isInstalled() ? `${os} app` : `${app}${os ? ` on ${os}` : ""}`;
}
function suggestedDeviceName() {
  const base = (/iPhone|iPad|Android/.exec(platformName())?.[0] ?? platformName().split(" ").pop() ?? "device").toLowerCase().replace(/[^a-z0-9]+/g, "-") || "device";
  for (let i = 1; ; i++) { const n = i === 1 ? base : `${base}-${i}`; if (!(S.devices ?? []).some((d) => d.name === n)) return n; }
}
const b64uBytes = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));

const sha16 = async (text) => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)))]
  .map((b) => b.toString(16).padStart(2, "0")).join("").slice(0, 16);

let swReg = null;
async function initPush() {
  if (!window.isSecureContext || !("serviceWorker" in navigator)) return;
  try { swReg = await navigator.serviceWorker.register("/sw.js"); } catch { return; }
  // A tapped notification opens its chat here (the service worker focuses this window and says where to go).
  navigator.serviceWorker.addEventListener("message", (e) => { if (e.data?.type === "open") location.hash = new URL(e.data.url, location.href).hash; });
  await findMyDevice();
}
// Which device (if any) is this browser: the server shows a short hash of each subscription.
async function findMyDevice() {
  const sub = await swReg?.pushManager?.getSubscription().catch(() => null);
  S.myEndpointId = sub ? await sha16(sub.endpoint) : null;
}
const myDevice = () => (S.devices ?? []).find((d) => d.endpointId && d.endpointId === S.myEndpointId);

// Turn notifications on in this browser, as a new device (name) or the one a CLI pairing code was made for (pair).
// Must be called straight from the tap or Enter: browsers only ask for permission during a user action.
async function enablePush({ name, pair }) {
  const blocker = pushBlocker();
  if (blocker) { toast(blocker); return; }
  const asked = Notification.requestPermission();
  try {
    if (await asked !== "granted") { toast("Notifications weren't allowed. Allow them for this site to get them here."); return; }
    const reg = swReg ?? (swReg = await navigator.serviceWorker.register("/sw.js"));
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (sub && sub.options.applicationServerKey && bytesB64u(sub.options.applicationServerKey) !== S.vapidKey) { await sub.unsubscribe(); sub = null; } // made for another server
    sub ??= await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(S.vapidKey) });
    const r = await api("POST", "/api/devices", { name, pair, subscription: sub.toJSON(), platform: platformName() });
    await findMyDevice(); await loadState();
    toast(r.error ? `${r.device.name} added, but the confirmation couldn't be sent: ${r.error}` : "Tap the “Confirm this device” notification to finish");
    return r.device;
  } catch (e) { toast(e.message); }
}

const deviceState = (d) => d.verified ? "Confirmed: gets a notification whenever an agent finishes"
  : d.connected ? (d.codePending ? "Waiting for you to tap “Confirm this device” on it" : "Not confirmed yet: send it a new confirmation")
  : d.pairPending ? `Waiting for pairing: type /devices pair <code> in the chat on it (code valid until ${new Date(d.pairExpires).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })})`
  : d.pairExpires ? "The pairing code expired: remove it and add it again"
  : "Notifications are off on that device: turn them on there again";
async function deviceAct(name, action, body, done) {
  try { const r = await api("POST", `/api/devices/${name}/${action}`, body); toast(done); await loadState(); return r; }
  catch (e) { toast(e.message); }
}
const sendConfirmation = (name) => deviceAct(name, "code", null, `Sent “Confirm this device” to ${name}: tap it there`);
const confirmDevice = (name, code) => deviceAct(name, "verify", { code }, `${name} confirmed: it gets a notification whenever an agent finishes`);
const testDevicePush = (name) => deviceAct(name, "test", null, `Test notification sent to ${name}`);
async function removeDevice(name) {
  if (!confirm(`Stop sending notifications to ${name}?`)) return;
  try {
    const mine = myDevice()?.name === name;
    await api("DELETE", `/api/devices/${name}`);
    if (mine) { await (await swReg?.pushManager.getSubscription())?.unsubscribe(); S.myEndpointId = null; }
    toast(`${name} removed`); await loadState(); return true;
  } catch (e) { toast(e.message); }
}

  const code = h("input", { class: "field", inputmode: "numeric", maxlength: "6", placeholder: "or its code", autocomplete: "one-time-code", style: "width:120px",

    h("h3", {}, d.name, mine ? h("span", { class: "chip", style: "margin-left:8px;vertical-align:middle;font-weight:500" }, "This device") : null),

      d.verified ? h("button", { class: "btn", onclick: () => testDevicePush(d.name).then(rerender) }, "Send test")

// /devices <add|pair|verify|test|remove> ... in the command modal: the same steps as the drawer.
const DEVICE_SUBS = [

  { name: "verify", arg: "<device> [code]", desc: "Send a device a new confirmation, or type its code" },

  if (!gap) {

      ...(!sub ? devices.map((d) => ({ ...pick(d), run: () => openDevicesDrawer() })) : []),
      ...DEVICE_SUBS.filter((c) => c.name.startsWith(sub.toLowerCase())).map((c) => ({
        icon: "/", label: `/devices ${c.name}`, hint: c.arg, desc: c.desc, insert: `/devices ${c.name} `, complete: `/devices ${c.name} ` })),

    }

  if (!gap2) {
    const picks = devices.filter(keep).filter((d) => d.name.startsWith(n));
    return { title: "Which device?", empty: !devices.length ? "No devices yet: /devices add" : sub === "verify" ? "No device is waiting for confirmation"

  if (d.verified) return { empty: `${n} is already confirmed. Try /devices test ${n}`, items: [] };
  if (!d.connected) return { empty: deviceState(d), items: [] };
  const items = [];
  if (/^\d{6}$/.test(code)) items.push({ icon: "✓", label: `Confirm ${n} with ${code}`, desc: "Only confirmed devices get notifications", run: () => confirmDevice(n, code) });
  items.push({ icon: "→", label: `Send ${n} a new confirmation`, desc: d.codePending ? "Or type the 6-digit code it shows" : "Then tap it on the device", run: () => sendConfirmation(n) });
  return { title: "Press Enter", items };
}

// Links: #agent=<name> (a tapped notification), #devices, #pair=<code>, #logins, #activity, #run=<id> (one interaction)
function openFromHash() {
  const [k, v = ""] = location.hash.slice(1).split("=");
  if (!k) return;
  history.replaceState(null, "", location.pathname + location.search); // so the same link works again
  if (k === "agent" && S.agents.some((a) => a.name === v)) open({ kind: "agent", name: v });
  if (k === "activity") { S.runOpen = null; open({ kind: "activity" }); }
  if (k === "run" && /^\d+$/.test(v)) openInteraction(Number(v));
  if (k === "devices") openDevicesDrawer();
  if (k === "logins") openLoginsDrawer();
  if (k === "pair") openDevicesDrawer({ pair: decodeURIComponent(v) });
}
window.addEventListener("hashchange", () => { if (!$("#app").hidden) openFromHash(); });

// ---------------- command modal: opens when the search box starts with "/" ----------------
// Commands here work from anywhere, not inside one chat. Items either fill in the box (insert),
// or do something (run); Tab completes an item's text without running it.
async function askAgent(name, text) {
  try { await api("POST", `/api/chats/${name}/messages`, { text }); open({ kind: "agent", name }); } // its remembered model and effort
  catch (e) { toast(e.message); }
}
async function runTask(name) {
  try { await api("POST", `/api/agents/${name}/run`); open({ kind: "agent", name }); } catch (e) { toast(e.message); }
}
async function setAgentOn(name, on) {
  try { await api("POST", `/api/agents/${name}/${on ? "enable" : "disable"}`); toast(`${name} ${on ? "enabled" : "disabled"}`); await loadState(); }
  catch (e) { toast(e.message); }
}
const agentPicks = (cmd, q, keep, run) => {
  const on = S.agents.filter(keep);
  return [...on.filter((a) => a.name.startsWith(q)), ...on.filter((a) => !a.name.startsWith(q) && a.name.includes(q))]
    .map((a) => ({ agent: a.name, label: a.name, desc: a.description || cronText(a.schedule), complete: `/${cmd} ${a.name}`, run: run && (() => run(a.name)) }));
};
// args(text) gets everything after the command name and returns { title, empty, items }.
const agentArg = (cmd, keep, empty, run) => (text) =>
  ({ title: "Agents", empty, items: agentPicks(cmd, text.trim().split(/\s+/)[0].toLowerCase(), keep, run) });
const PALETTE = [
  { name: "new", arg: "[name]", desc: "Create an agent (random name if you skip it)", run: (arg) => openAgentDrawer(arg.trim()) },
  { name: "ask", arg: "<agent> <message>", desc: "Send a message to any agent", needsArg: true, args: (text) => {
    const [, who, gap, msg = ""] = text.replace(/^\s+/, "").match(/^(\S*)(\s+([\s\S]*))?$/);
    if (!gap) return { title: "Ask which agent?", empty: "No agent that's turned on matches", items: agentPicks("ask", who.toLowerCase(), (a) => a.enabled, null).map((it) => ({ ...it, insert: `/ask ${it.agent} ` })) };
    const a = S.agents.find((x) => x.name === who.toLowerCase());
    if (!a) return { empty: `No agent called ${who}`, items: [] };
    if (!a.enabled) return { empty: `${a.name} is turned off. Use /enable ${a.name} first.`, items: [] };
    if (!msg.trim()) return { empty: `Type your message for ${a.name}, then press Enter`, items: [] };
    return { title: "Press Enter to send", items: [{ agent: a.name, label: `Send to ${a.name}`, desc: msg.trim(), run: () => askAgent(a.name, msg.trim()) }] };

  { name: "run", arg: "<agent>", desc: "Run an agent's scheduled task now", needsArg: true,

  { name: "group", desc: "Create a group chat", run: () => openGroupDrawer() },
  { name: "approvals", desc: "Open the suggestions waiting for you", run: () => open({ kind: "approvals" }) },
  { name: "activity", desc: "Everything your agents did: commands, tools, what they said, changes, approvals (the log)", run: () => open({ kind: "activity" }) },
  { name: "devices", arg: "[add|pair|verify|test|remove]", desc: "Phones and computers notified when an agent finishes", run: () => openDevicesDrawer(), args: deviceArgs },
  { name: "logins", desc: "Site logins for the browser agent (the vault)", run: () => openLoginsDrawer() },
  { name: "help", desc: "Show all commands", run: () => openCmd("/") },

const noMatch = (name) => `No commands match “/${name}”. Type / to see them all.`;
const paletteFor = (q) => (S.cmdFrom === "chat" ? chatPaletteFor : globalPaletteFor)(q);
function globalPaletteFor(q) {

    return { title: "Commands", empty: noMatch(name), items: PALETTE.filter((c) => c.name.startsWith(name)).map((c) => ({
      icon: "/", label: `/${c.name}`, hint: c.arg, desc: c.desc, complete: c.arg ? `/${c.name} ` : `/${c.name}`,
      ...(c.needsArg ? { insert: `/${c.name} ` } : { run: () => c.run("") }) })) };
  }
  const cmd = PALETTE.find((c) => c.name === name);
  if (!cmd) return { empty: noMatch(name), items: [] };
  if (cmd.args) return cmd.args(rest);
  const arg = rest.trim();

// The message box's own commands (/new conversation, /run, ...), run by runCommand like before.

      icon: "/", label: `/${c.name}`, hint: c.arg, desc: c.desc, complete: c.arg ? `/${c.name} ` : `/${c.name}`,
      ...(c.arg ? { insert: `/${c.name} ` } : { run: () => runCommand(`/${c.name}`) }) })) };

  const cmd = commandsHere().find((c) => c.name === name);
  if (!cmd) return { empty: COMMANDS.some((c) => c.name === name) ? `/${name} only works in an agent's own chat.` : noMatch(name), items: [] };

const cmdOpen = () => !$("#cmd").hidden;

      it.agent ? avatar(it.agent, "xs") : h("span", { class: "slash", "aria-hidden": "true" }, it.icon),
      h("span", { class: "label" }, it.label, it.hint ? h("small", {}, ` ${it.hint}`) : null),

function sizeCmd() { const t = $("#cmd-text"); t.style.height = "auto"; t.style.height = `${Math.min(t.scrollHeight, 220)}px`; }

// from: "search" (the sidebar search box) or "chat" (the message box); it decides the commands and where focus returns

}
// back: return focus to where the "/" was typed (not when a command ran and moved somewhere else)

$("#cmd-text").addEventListener("input", (e) => {

  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); return closeCmd(); }
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && n) {
    e.preventDefault(); S.palIndex = (S.palIndex + (e.key === "ArrowDown" ? 1 : -1) + n) % n; return renderPalette();
  }
  if (e.key === "Tab") { e.preventDefault(); if (n) paletteAct(S.palIndex, true); return; } // keeps focus in the box
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (n) paletteAct(S.palIndex); else toast(S.pal?.empty ?? "Type / to see the commands"); }
});
$("#cmd-list").addEventListener("mousedown", (e) => e.preventDefault()); // keep focus in the box
$("#cmd-scrim").addEventListener("click", () => closeCmd());

// ---------------- live updates ----------------
let es, refreshTimer, retryTimer, missed = false;
const refreshSoon = () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(() => loadState().catch(() => {}), 400); };
function connect() {
  es?.close(); clearTimeout(retryTimer);
  es = new EventSource("/api/stream");
  // Connected again after a gap (the server restarted, the phone was offline): load what happened meanwhile.
  es.addEventListener("hello", () => {
    if (!missed) return;
    missed = false; S.live.clear(); S.progress = {}; // who is running now comes right after this
    loadState().catch(() => {}); reloadMessages().catch(() => {});
    if (S.view?.kind === "approvals") renderApprovals().catch(() => {});
    if (S.view?.kind === "activity") renderActivity();
  });
  es.addEventListener("log", (ev) => {
    const e = JSON.parse(ev.data);
    if (S.view?.kind === "activity" && forActivity(e) && !S.activity.some((x) => x.id === e.id)) { S.activity.unshift(e); drawActivity(); }
    liveInteraction(e);
  });
  es.addEventListener("message", (ev) => {
    const m = JSON.parse(ev.data);
    const here = (S.view?.kind === "agent" && m.chat === S.view.name) || (S.view?.kind === "group" && m.chat === `group:${S.view.id}`);
    if (here && !S.messages.some((x) => x.id === m.id)) {
      if (m.role === "agent") delete S.progress[m.author];
      appendMessage(m);
    }
    refreshSoon();
  });
  es.addEventListener("progress", (ev) => {
    const p = JSON.parse(ev.data);
    if (p.type === "tool") S.progress[p.agent] = `using ${toolLabel(p.name.replace(/^mcp__(\w+)__/, "")).toLowerCase()}`;
    else S.progress[p.agent] = "writing";
    if ((S.view?.kind === "agent" && S.view.name === p.agent) || curGroup()?.members.includes(p.agent)) renderHead();
    renderTyping();
  });
  es.addEventListener("running", (ev) => {
    const r = JSON.parse(ev.data);
    if (r.running) { S.live.add(r.agent); S.running.add(r.agent); }
    else { S.live.delete(r.agent); S.running.delete(r.agent); delete S.progress[r.agent]; }
    renderList(); if (S.view?.kind === "agent" || S.view?.kind === "group") renderHead(); renderTyping();
  });
  es.addEventListener("event", (ev) => {
    const e = JSON.parse(ev.data);
    if ((e.action === "approve" || e.action === "reject") && e.details?.proposal) setProposalStatus(e.details.proposal, e.action === "approve" ? "approved" : "rejected");
    if (S.view?.kind === "approvals" && /propose|approve|reject/.test(e.action)) renderApprovals();
    // In the proposer's own chat the Approve/Reject buttons appear under its reply, so no toast there.
    const here = S.view?.kind === "agent" ? S.view.name === e.actor : !!curGroup()?.members.includes(e.actor);
    if (/^device-/.test(e.action)) {
      if (e.action === "device-verify") toast(`${e.details?.device} confirmed: it gets a notification whenever an agent finishes`);
      loadState().then(() => { if (devicesOpen()) openDevicesDrawer(); }).catch(() => {});
    }
    if (/propose-/.test(e.action) && !here) toast(`${e.actor} suggested ${e.action === "propose-create" ? "a new agent" : "a change"}. Open Approvals to review.`);
    // An agent waiting mid-run: its card arrives as a message in its chat; elsewhere, say so.
    if (/^action-/.test(e.action)) {
      if (e.action === "action-request" && !(S.view?.kind === "agent" && S.view.name === e.agent)) {
        toast(e.details?.kind === "takeover" ? `${labelOf(e.agent)} needs you in its browser. See Approvals.` : `${labelOf(e.agent)} is waiting for your OK. See Approvals.`);
      }
      if (e.action !== "action-request" && e.details?.request) setActionStatus(e.details.request, e.action.slice(7));
      if (S.view?.kind === "approvals") renderApprovals();
      loadState().catch(() => {}); // who is waiting changed: recolour their dots
    }
    if (/^task-(start|done|fail)$/.test(e.action) && S.messages.some((m) => m.tasks?.some((t) => t.id === e.details?.task))) reloadMessages().catch(() => {});
    if (/^(login|site)-/.test(e.action)) {
      if (e.details?.request && (e.action === "login-save" || e.action === "login-dismiss")) setLoginStatus(e.details.request, e.action === "login-save" ? "saved" : "dismissed");
      if (e.action === "login-request" && !here) toast(`${labelOf(e.actor)} needs your ${hostOf(e.details?.site)} login. Open its chat to add it.`);
      loadLogins().then(() => { if (loginsOpen()) openLoginsDrawer(); });
    }
    refreshSoon();
  });
  es.onerror = () => { es.close(); missed = true; reconnect(); };
}
// Keeps trying until the server answers again: after 3 s, then up to 30 s apart. Signed out meanwhile: the login shows instead.
function reconnect(delay = 3000) {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => api("GET", "/api/me").then(connect, (e) => { if (e.message !== "Signed out") reconnect(Math.min(Math.max(delay, 1500) * 2, 30000)); }), delay);
}
// Back in view or back online (a phone waking up): don't wait for the next try.
const wake = () => { if (!$("#app").hidden && es?.readyState === EventSource.CLOSED) reconnect(0); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); });
window.addEventListener("online", wake);

// ---------------- composer behaviour ----------------
const autosize = () => { const t = $("#text"); t.style.height = "auto"; t.style.height = `${Math.min(t.scrollHeight, 180)}px`; };
const updateSend = () => { $("#send").disabled = !$("#text").value.trim() && !S.attachments.length; };
$("#text").addEventListener("input", (e) => {
  // A message starting with "/" is a command: move it into the floating command box.
  if (e.target.value.startsWith("/") && (S.view?.kind === "agent" || S.view?.kind === "group")) {
    const v = e.target.value; e.target.value = ""; autosize(); updateSend(); return openCmd(v, "chat");
  }
  autosize(); updateSend(); updateSuggest();
});
$("#text").addEventListener("keydown", (e) => {
  const s = S.sug;
  if (s && !e.isComposing) {
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && s.items.length) {
      e.preventDefault();
      s.index = (s.index + (e.key === "ArrowDown" ? 1 : -1) + s.items.length) % s.items.length;
      return renderSuggest();
    }
    if (((e.key === "Enter" && !e.shiftKey) || e.key === "Tab") && s.items.length) { e.preventDefault(); return pickSuggest(s.index, e.key === "Tab"); }
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); return closeSuggest(); }
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(pointer: fine)").matches) { e.preventDefault(); send(); }
});
$("#text").addEventListener("keyup", (e) => { if (/^(ArrowLeft|ArrowRight|Home|End)$/.test(e.key)) updateSuggest(); });
$("#text").addEventListener("click", updateSuggest);
$("#text").addEventListener("blur", closeSuggest);
$("#suggest").addEventListener("mousedown", (e) => e.preventDefault()); // keep focus in the message box
$("#send").addEventListener("click", send);
$("#attach").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
$("#text").addEventListener("paste", (e) => { const f = [...e.clipboardData.files].filter((x) => x.type.startsWith("image/")); if (f.length && S.view?.kind === "agent") { e.preventDefault(); addFiles(f); } });
$("#q").addEventListener("input", (e) => {
  if (e.target.value.startsWith("/")) { const v = e.target.value; e.target.value = S.filter = ""; renderList(); return openCmd(v); }
  S.filter = e.target.value; renderList();
});
$("#q").addEventListener("keydown", (e) => { if (e.key === "Escape" && e.target.value) { e.preventDefault(); e.stopPropagation(); e.target.value = S.filter = ""; renderList(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { S.newHook = null; $("#drawer-root").replaceChildren(); } });

// ---------------- boot ----------------
function showLogin() { $("#app").hidden = true; $("#login").hidden = false; es?.close(); clearTimeout(retryTimer); setTimeout(() => $("#pw").focus(), 0); }
async function boot() {
  $("#login").hidden = true; $("#app").hidden = false;
  await Promise.all([loadState(), loadLogins()]); connect();
  await initPush().catch(() => {});
  openDefault(); openFromHash();
}
$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault(); $("#login-err").textContent = "";
  try { await api("POST", "/api/login", { password: $("#pw").value }); $("#pw").value = ""; boot(); }
  catch (err) { $("#login-err").textContent = err.message; }
});
$("#logout").addEventListener("click", async () => { await api("POST", "/api/logout").catch(() => {}); showLogin(); });
api("GET", "/api/me").then(boot).catch(() => showLogin());
</script>
</body>
