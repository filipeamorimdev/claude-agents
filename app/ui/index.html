<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121722" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agents">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Agents</title>
<style>
:root {
  --paper: #EEF1F5;
  --surface: #FFFFFF;
  --surface-2: #F6F8FB;
  --ink: #17202E;
  --muted: #5B6676;
  --line: #D9DEE6;
  --cobalt: #2450D3;
  --cobalt-ink: #FFFFFF;
  --amber: #E3A008;
  --amber-soft: #FFF4D6;
  --danger: #C2362B;
  --shadow: 0 1px 2px rgba(23, 32, 46, .08);
  --radius-bubble: 16px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-head: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #121722; --surface: #1A2130; --surface-2: #202939; --ink: #E6EAF1; --muted: #98A2B3;
    --line: #2C3546; --cobalt: #4C74F0; --amber: #F2B53A; --amber-soft: #3A2F14; --danger: #F0645A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
[hidden] { display: none !important; }

/* ---------- login ---------- */
.login { min-height: 100%; display: grid; place-items: center; padding: 24px; }
.login form { width: min(360px, 100%); background: var(--surface); border-radius: 20px; padding: 28px; box-shadow: var(--shadow); }
.login h1 { font: 600 22px/1.2 var(--font-head); margin: 0 0 6px; }
.login p { margin: 0 0 20px; color: var(--muted); }
.login input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.login .err { color: var(--danger); min-height: 1.4em; margin: 8px 0 0; font-size: 14px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 340px 1fr; height: 100dvh; }
.side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side-head { display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px; min-height: 60px; }
.side-head h1 { font: 650 22px/1 var(--font-head); margin: 0; flex: 1; letter-spacing: -.01em; }
.icon-btn { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.search { margin: 4px 16px 10px; }
.search input { width: 100%; border: 0; background: var(--surface-2); border-radius: 10px; padding: 9px 12px; }
.list { overflow-y: auto; flex: 1; padding: 0 8px 12px; }
.row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; width: 100%; border: 0; background: transparent; text-align: left; padding: 9px 8px; border-radius: 12px; }
.row:hover { background: var(--surface-2); }
.row[aria-current="true"] { background: color-mix(in srgb, var(--cobalt) 10%, transparent); }
.row .name { font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
.row .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .preview { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .when { color: var(--muted); font-size: 12px; align-self: start; padding-top: 3px; }
.row.off .name, .row.off .preview { opacity: .55; }
.badge { background: var(--amber); color: #1D1500; border-radius: 999px; font-size: 12px; font-weight: 700; min-width: 22px; height: 22px; padding: 0 7px; display: inline-grid; place-items: center; }
.side-foot { border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
.signout { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; color: var(--muted); padding: 8px 10px; border-radius: 10px; font-size: 14px; }
.signout:hover { background: var(--surface-2); color: var(--ink); }
.divider { height: 1px; background: var(--line); margin: 6px 12px; }

.avatar { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font: 650 16px/1 var(--font-head); color: #fff; background: var(--hue, #777); position: relative; flex: none; }
.avatar.sm { width: 32px; height: 32px; border-radius: 10px; font-size: 13px; }
.avatar.xs { width: 24px; height: 24px; border-radius: 8px; font-size: 11px; }
.avatar.you { background: var(--cobalt); }
.avatar.approvals { background: var(--amber); color: #1D1500; }
.members { display: flex; flex-direction: column; gap: 2px; max-height: 340px; overflow-y: auto; }
.members label { display: grid; grid-template-columns: auto auto 1fr; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 10px; cursor: pointer; }
.members label:hover { background: var(--surface-2); }
.members input { width: 18px; height: 18px; accent-color: var(--cobalt); margin: 0; }
.members .desc { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
textarea.field { resize: vertical; min-height: 140px; line-height: 1.45; }
.field-hint { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }
.avatar .live { position: absolute; right: -3px; bottom: -3px; width: 13px; height: 13px; border-radius: 50%; background: #2BB673; border: 2.5px solid var(--surface); }
@media (prefers-reduced-motion: no-preference) {
  .avatar .live { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.75); } }
}

/* ---------- main pane ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); min-height: 64px; }
.chat-head .who { flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; padding: 0; }
.chat-head .title { font: 650 17px/1.2 var(--font-head); }
.chat-head .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back { display: none; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: 14px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--cobalt-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }

.scroll { flex: 1; overflow-y: auto; padding: 16px clamp(12px, 4vw, 48px) 8px; }
.stream { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.day { align-self: center; color: var(--muted); font-size: 12.5px; background: var(--surface); padding: 3px 10px; border-radius: 999px; margin: 10px 0 4px; box-shadow: var(--shadow); }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: min(640px, 88%); }
.msg.you { align-self: flex-end; flex-direction: row-reverse; }
.bubble { background: var(--surface); padding: 9px 13px; border-radius: var(--radius-bubble); border-bottom-left-radius: 6px; box-shadow: var(--shadow); min-width: 0; overflow-wrap: anywhere; }
.msg.you .bubble { background: var(--cobalt); color: var(--cobalt-ink); border-bottom-left-radius: var(--radius-bubble); border-bottom-right-radius: 6px; }
.bubble .meta { font-size: 11.5px; color: var(--muted); margin-top: 4px; display: flex; justify-content: flex-end; gap: 10px; }
.msg.you .bubble .meta { color: color-mix(in srgb, var(--cobalt-ink) 75%, transparent); }
.bubble.failed { box-shadow: inset 3px 0 0 var(--danger), var(--shadow); }
.bubble .task { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.bubble img { display: block; max-width: 100%; max-height: 320px; border-radius: 10px; margin: 2px 0 6px; }
.note { align-self: center; text-align: center; color: var(--muted); font-size: 13px; max-width: 560px; padding: 2px 8px; }

/* markdown inside bubbles */
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md table { margin: 0 0 .55em; }
.md ul, .md ol { padding-left: 1.25em; }
.md .h { display: block; font-weight: 700; margin: .5em 0 .25em; }
.md code { font: 13px var(--font-code); background: color-mix(in srgb, var(--ink) 8%, transparent); padding: 1px 5px; border-radius: 5px; }
.md pre { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; overflow-x: auto; }
.md pre code { background: none; padding: 0; font-size: 12.5px; }
.md table { border-collapse: collapse; font-size: 13.5px; display: block; overflow-x: auto; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 4px 10px 4px 0; text-align: left; vertical-align: top; }
.md a { color: inherit; text-underline-offset: 2px; }
.msg.you .md code { background: rgba(255,255,255,.18); }

/* typing / progress */
.typing { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; padding: 4px 2px; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--hue, var(--muted)); opacity: .5; }
@media (prefers-reduced-motion: no-preference) {
  .dots i { animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 40% { opacity: 1; transform: translateY(-2px); } }
}

/* composer */
.composer { background: var(--surface); border-top: 1px solid var(--line); padding: 10px clamp(12px, 4vw, 48px) calc(10px + env(safe-area-inset-bottom)); }
.composer-inner { max-width: 820px; margin: 0 auto; }
.attach-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.attach-list figure { margin: 0; position: relative; }
.attach-list img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; display: block; }
.attach-list button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--ink); color: var(--surface); font-size: 13px; line-height: 1; }
.compose-row { display: flex; align-items: flex-end; gap: 8px; }
.compose-row textarea { flex: 1; resize: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 10px 14px; max-height: 180px; min-height: 44px; line-height: 1.4; }
.send { width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--cobalt); color: #fff; display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .45; cursor: default; }
.settings { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.pill { position: relative; display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--muted); }
.pill select { appearance: none; border: 0; background: transparent; color: var(--ink); font-weight: 600; padding-right: 14px; cursor: pointer; }
.pill::after { content: ""; position: absolute; right: 10px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.settings .hint { color: var(--muted); font-size: 12.5px; margin-left: auto; }

/* @agent / slash-command suggestions */
.composer-inner { position: relative; }
.suggest { position: absolute; left: 0; right: 0; bottom: calc(100% + 18px); z-index: 10; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 28px rgba(10, 14, 22, .18); padding: 6px; max-height: 280px; overflow-y: auto; }
.suggest-head { font-size: 12px; color: var(--muted); padding: 4px 8px 6px; }
.palette { padding: 0 0 8px; }
/* command modal: opens when "/" is typed in the search box */
.cmd { position: fixed; inset: 0; z-index: 25; display: flex; justify-content: center; align-items: flex-start; padding: clamp(16px, 12vh, 120px) 16px 16px; }
.cmd-scrim { position: absolute; inset: 0; background: rgba(10, 14, 22, .45); }
.cmd-box { position: relative; width: min(680px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 24px 60px rgba(10, 14, 22, .35); overflow: hidden; }
.cmd-box textarea { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; resize: none; padding: 18px 20px; font: 400 20px/1.4 var(--font); min-height: 64px; max-height: 220px; outline: none; }
.cmd-box .palette { overflow-y: auto; padding: 8px; min-height: 0; }
.cmd-foot { display: flex; gap: 14px; flex-wrap: wrap; border-top: 1px solid var(--line); padding: 8px 16px; color: var(--muted); font-size: 12px; }
.cmd-foot kbd { font: 600 11px var(--font-code); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
@media (max-width: 760px) { .cmd { padding-top: 12px; } .cmd-box textarea { font-size: 18px; } }
@media (pointer: coarse) { .cmd-foot { display: none; } }
:is(.suggest, .palette) button { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; width: 100%; border: 0; background: transparent; text-align: left; padding: 7px 8px; border-radius: 10px; }
:is(.suggest, .palette) button:hover { background: var(--surface-2); }
:is(.suggest, .palette) button[aria-selected="true"] { background: color-mix(in srgb, var(--cobalt) 12%, transparent); }
:is(.suggest, .palette) .label { font-weight: 600; font-family: var(--font-code); font-size: 13.5px; }
:is(.suggest, .palette) .label small { font-weight: 400; color: var(--muted); }
:is(.suggest, .palette) .desc { grid-column: 2; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
:is(.suggest, .palette) .slash { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font: 600 14px var(--font-code); grid-row: span 2; }
:is(.suggest, .palette) .avatar { grid-row: span 2; }
.local { align-self: stretch; max-width: 640px; background: var(--surface-2); border: 1px dashed var(--line); border-radius: var(--radius-bubble); padding: 10px 14px; }
.local .meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; }

/* a suggestion waiting for you, shown under the reply that made it */
.ask { align-self: flex-start; margin-left: 40px; width: min(520px, calc(100% - 40px)); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 14px; border-left: 4px solid var(--amber); }
.ask.done { border-left-color: var(--line); }
.ask-title { font-weight: 650; }
.ask-line { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.ask .actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.ask-status { font-size: 13.5px; font-weight: 600; color: var(--muted); }
.ask-status.approved { color: #2BB673; }

/* approvals */
.cards { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 16px 18px; border-left: 4px solid var(--amber); }
.card h3 { font: 650 17px/1.3 var(--font-head); margin: 0 0 2px; }
.card .by { color: var(--muted); font-size: 13.5px; margin-bottom: 10px; }
.card .why { margin: 0 0 12px; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; margin: 0 0 12px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; }
.chip { display: inline-block; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 1px 8px; font-size: 13px; margin: 0 4px 4px 0; }
.chip.new { border-color: var(--amber); background: var(--amber-soft); }
details.prompt summary { cursor: pointer; color: var(--muted); font-size: 14px; margin-bottom: 6px; }
details.prompt pre { white-space: pre-wrap; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font: 13px/1.45 var(--font-code); margin: 0 0 12px; max-height: 360px; overflow: auto; }
.card .actions { display: flex; gap: 8px; justify-content: flex-end; }
.empty { text-align: center; color: var(--muted); padding: 60px 20px; max-width: 420px; margin: 0 auto; }
.empty h2 { font: 650 19px/1.3 var(--font-head); color: var(--ink); margin: 0 0 6px; }

/* agent drawer */
.drawer { position: fixed; inset: 0 0 0 auto; width: min(420px, 100%); background: var(--surface); box-shadow: -8px 0 30px rgba(0,0,0,.15); z-index: 20; display: flex; flex-direction: column; }
.drawer-head { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid var(--line); }
.drawer-body { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
.drawer-head .drawer-title { flex: 1; min-width: 0; font: 650 18px var(--font-head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer-foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.drawer-foot .btn.primary { min-width: 96px; }
.choices { display: grid; gap: 12px; }
.choice { display: grid; grid-template-columns: 48px 1fr auto; gap: 14px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 16px; padding: 16px; }
.choice:hover:not(:disabled) { border-color: var(--cobalt); background: color-mix(in srgb, var(--cobalt) 7%, var(--surface-2)); }
.choice:disabled { opacity: .55; cursor: default; }
.choice .ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--cobalt); color: #fff; }
.choice.group .ic { background: var(--amber); color: #1D1500; }
.choice h3 { margin: 0; font: 650 16px/1.3 var(--font-head); }
.choice p { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; }
.choice .chev { color: var(--muted); font-size: 22px; line-height: 1; }
.drawer-body pre { white-space: pre-wrap; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font: 13px/1.45 var(--font-code); margin: 0; }
.drawer-body h4 { margin: 0 0 6px; font: 600 14px var(--font-head); color: var(--muted); }
.runs { font-size: 13.5px; display: flex; flex-direction: column; gap: 6px; }
.runs div { display: flex; gap: 8px; } .runs time { color: var(--muted); flex: none; width: 92px; }
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 22, .35); z-index: 19; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 12px; z-index: 30; font-size: 14px; max-width: calc(100% - 32px); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .app.in-chat .side { display: none; }
  .app:not(.in-chat) .main { display: none; }
  .back { display: grid; }
  .msg { max-width: 92%; }
}
</style>
</head>
<body>

<section class="login" id="login" hidden>
  <form id="login-form">
    <h1>Your agents</h1>
    <p>Enter the password from your install to continue.</p>
    <label class="sr" for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <p class="err" id="login-err" role="alert"></p>
    <button class="btn primary" style="width:100%;padding:11px" type="submit">Sign in</button>
  </form>
</section>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="side-head">
      <h1>Agents</h1>
      <button class="icon-btn" id="devices-btn" title="Push notifications" aria-label="Push notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
      </button>
      <button class="icon-btn" id="new-agent" title="New agent or group" aria-label="New agent or group">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM3 20c0-3 2.7-5 6-5 1.4 0 2.6.3 3.6.9M18 14v6M15 17h6"/></svg>
      </button>
    </div>
    <div class="search"><label class="sr" for="q">Search agents, or type / for a command</label><input id="q" type="search" placeholder="Search, or / for commands" autocomplete="off" aria-controls="list" aria-haspopup="dialog"></div>
    <nav class="list" id="list" aria-label="Chats"></nav>
    <div class="side-foot">
      <button class="signout" id="logout">

  </div>

<script>
"use strict";
// ---------------- utilities ----------------
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
};
const api = async (method, url, body, raw) => {
  const res = await fetch(url, {
    method, credentials: "same-origin",
    headers: raw ? { "Content-Type": raw.type } : body ? { "Content-Type": "application/json" } : {},
    body: raw ?? (body ? JSON.stringify(body) : undefined),
  });
  if (res.status === 401 && url !== "/api/login") { showLogin(); throw new Error("Signed out"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
};
const hueOf = (name) => { let x = 0; for (const c of name) x = (x * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${x % 360} 58% 46%)`; };
// An agent's name as the human sees it: the display name it chose, else its id.
const labelOf = (name) => S.agents?.find((a) => a.name === name)?.displayName || name;
const initials = (name) => {
  const words = labelOf(name).split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const caps = words.filter((w) => w[0] !== w[0].toLowerCase()); // "Matias, the Market Researcher" -> MM
  return (caps.length >= 2 ? caps : words).slice(0, 2).map((w) => w[0].toUpperCase()).join("") || "?";
};
const avatar = (name, size = "", live = false) => h("div", { class: `avatar ${size}`, style: `--hue:${hueOf(name)}`, "aria-hidden": "true" }, initials(name), live && h("i", { class: "live" }));
const timeOf = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const whenOf = (iso) => {
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString()) return timeOf(iso);
  const diff = (now - d) / 864e5;
  return diff < 6 ? d.toLocaleDateString([], { weekday: "short" }) : d.toLocaleDateString([], { day: "numeric", month: "short" });
};
const dayOf = (iso) => {
  const d = new Date(iso), now = new Date(), y = new Date(now - 864e5);
  if (d.toDateString() === now.toDateString()) return "Today";
  if (d.toDateString() === y.toDateString()) return "Yesterday";
  return d.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
};
const cronText = (c) => {
  if (!c) return "On demand";
  const [m, hr, dom, mon, dow] = c.split(" ");
  const days = { "*": "Every day", "1-5": "Weekdays", "0,6": "Weekends", "6,0": "Weekends" };
  if (/^\d+$/.test(m) && /^\d+$/.test(hr) && dom === "*" && mon === "*" && days[dow])
    return `${days[dow]} at ${hr.padStart(2, "0")}:${m.padStart(2, "0")}`;
  if (/^\d+$/.test(m) && hr === "*" && dom === "*" && mon === "*" && dow === "*") return `Every hour at :${m.padStart(2, "0")}`;
  return `Schedule ${c}`;
};
let toastTimer;
const toast = (msg) => {
  document.querySelector(".toast")?.remove();
  const t = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3500);
};

// Small, safe markdown: escape first, then a few constructs.
function md(src) {
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  const out = []; const lines = String(src ?? "").replace(/\r/g, "").split("\n");
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith("```")) {
      const code = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) code.push(lines[i++]);
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      i--;
      const cells = (r) => r.trim().slice(1, -1).split("|").map((c) => c.trim());
      const body = rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<table>${body.map((r, n) => `<tr>${cells(r).map((c) => n === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table>`);
      continue;
    }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(line)) {
      const ordered = /^\s*\d/.test(line); const items = [];
      while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*•]|\d+[.)])\s+/, ""));
      i--;
      out.push(`<${ordered ? "ol" : "ul"}>${items.map((t) => `<li>${inline(t)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`); continue;
    }
    const head = line.match(/^#{1,6}\s+(.*)/);
    if (head) { out.push(`<span class="h">${inline(head[1])}</span>`); continue; }
    if (!line.trim()) { out.push(""); continue; }
    const para = [line];
    while (i + 1 < lines.length && lines[i + 1].trim() && !/^(```|#{1,6}\s|\s*\||\s*([-*•]|\d+[.)])\s)/.test(lines[i + 1])) para.push(lines[++i]);
    out.push(`<p>${para.map(inline).join("<br>")}</p>`);
  }
  const div = h("div", { class: "md" }); div.innerHTML = out.join(""); return div;
}

// ---------------- state ----------------
const S = {
  agents: [], groups: [], models: [], modelGroups: [], efforts: {}, tools: [], proposals: 0,
  view: null,            // { kind: "agent"|"group"|"approvals", name? (agent), id? (group) }
  messages: [], attachments: [], progress: {}, running: new Set(), live: new Set(), filter: "",
  pal: null, palIndex: 0, cmdFrom: "search", // command modal: what it offers, the highlighted item, where "/" was typed
};
const MODEL_LABEL = {
  haiku: "Haiku", sonnet: "Sonnet", opus: "Opus",
  "gpt-6.1-sol": "GPT-6.1 Sol", "gpt-6-astra": "GPT-6 Astra", "gpt-6.1-terra": "GPT-6.1 Terra", "gpt-6-luna": "GPT-6 Luna",
};
const modelLabel = (m) => MODEL_LABEL[m] ?? m;
const EFFORT_LABEL = { low: "Low", medium: "Medium", high: "High", xhigh: "Extra high", max: "Max" };

async function loadState() {
  const st = await api("GET", "/api/state");
  Object.assign(S, { agents: st.agents, groups: st.groups, models: st.models, modelGroups: st.modelGroups, efforts: st.efforts, tools: st.tools, proposals: st.proposals, devices: st.devices, vapidKey: st.vapidKey });
  // live updates (SSE) win over the snapshot, which can lag a run by a moment
  S.running = new Set([...st.agents.filter((a) => a.running).map((a) => a.name), ...S.live]);
  renderList();
  if (S.view?.kind === "agent" || S.view?.kind === "group") renderHead();
  if (cmdOpen()) renderPalette();
}
const curGroup = () => S.view?.kind === "group" ? S.groups.find((g) => g.id === S.view.id) : null;
const groupAvatar = (g, size = "") => {
  const el = h("div", { class: `avatar ${size}`, style: `--hue:${hueOf(g.name)}`, "aria-hidden": "true" });
  el.innerHTML = '<svg width="55%" height="55%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2 20c0-3 2.7-5 6-5s6 2 6 5M14 15.3c.6-.2 1.3-.3 2-.3 3.3 0 6 2 6 5"/></svg>';
  if (g.members.some((m) => S.running.has(m))) el.append(h("i", { class: "live" }));
  return el;
};

// ---------------- sidebar ----------------
function renderList() {
  const list = $("#list"); list.replaceChildren();
  const cur = S.view;
  const item = (key, av, title, preview, when, extra, onclick, off) => h("button", {
    class: `row${off ? " off" : ""}`, "aria-current": cur && key === `${cur.kind}:${cur.name ?? cur.id ?? ""}` ? "true" : "false", onclick,
  }, av, h("div", { style: "min-width:0" }, h("div", { class: "name" }, h("span", {}, title), extra), h("div", { class: "preview" }, preview)), when);

  list.append(item("approvals:", h("div", { class: "avatar approvals", "aria-hidden": "true" }, "✓"),
    "Approvals", S.proposals ? `${S.proposals} waiting for you` : "Nothing to review",
    h("div", { class: "when" }), S.proposals ? h("span", { class: "badge" }, S.proposals) : null, () => open({ kind: "approvals" })));
  list.append(h("div", { class: "divider", role: "separator" }));

  const f = S.filter.toLowerCase();
  const groups = S.groups.filter((g) => !f || g.name.toLowerCase().includes(f) || g.members.some((m) => m.includes(f)));
  for (const g of groups) {
    const busy = g.members.filter((m) => S.running.has(m));
    list.append(item(`group:${g.id}`, groupAvatar(g), g.name,
      busy.length ? `${busy[0]} is working…` : g.last ? previewOf(g.last) : g.members.join(", "),
      h("div", { class: "when" }, g.last ? whenOf(g.last.created_at) : ""), null, () => open({ kind: "group", id: g.id })));
  }
  if (groups.length) list.append(h("div", { class: "divider", role: "separator" }));

  for (const a of S.agents.filter((a) => !f || a.name.includes(f) || labelOf(a.name).toLowerCase().includes(f) || a.description.toLowerCase().includes(f))) {
    const running = S.running.has(a.name);
    list.append(item(`agent:${a.name}`, avatar(a.name, "", running), labelOf(a.name),
      running ? "Working…" : a.last ? previewOf(a.last) : a.description || cronText(a.schedule),
      h("div", { class: "when" }, a.last ? whenOf(a.last.created_at) : ""), null,
      () => open({ kind: "agent", name: a.name }), !a.enabled));
  }
}
const previewOf = (m) => `${m.role === "human" ? "You: " : m.role === "agent" && m.chat.startsWith("group:") ? `${m.author}: ` : ""}${(m.text || (m.attachments?.length ? "Photo" : "")).replace(/[#*`|]/g, "").replace(/\s+/g, " ").slice(0, 90)}`;

// ---------------- views ----------------
let openSeq = 0;
async function open(view) {
  const seq = ++openSeq;
  S.view = view; S.messages = []; S.attachments = []; renderAttachments();
  $("#app").classList.add("in-chat");
  renderList(); renderHead();
  const stream = $("#stream"); stream.replaceChildren();
  $("#composer").hidden = view.kind === "approvals";
  $("#settings").hidden = view.kind !== "agent";
  $("#attach").hidden = view.kind !== "agent";
  $("#text").placeholder = view.kind === "agent" ? `Message ${labelOf(view.name)}, or /help` : view.kind === "group" ? `Message everyone in ${curGroup()?.name}, or /help` : "";
  closeSuggest();
  if (view.kind === "agent") { fillSettings(); const r = await api("GET", `/api/chats/${view.name}/messages`); if (seq !== openSeq) return; S.messages = r.messages; renderMessages(); }
  if (view.kind === "group") { const r = await api("GET", `/api/groups/${view.id}/messages`); if (seq !== openSeq) return; S.messages = r.messages; renderMessages(); }
  if (view.kind === "approvals") renderApprovals();
  if (view.kind !== "approvals" && matchMedia("(min-width: 761px)").matches) $("#text").focus();
}

// On a wide screen, open the chat with the latest message (or Approvals); on a phone, show the list.
function openDefault() {
  if (!matchMedia("(min-width: 761px)").matches) { $("#app").classList.remove("in-chat"); S.view = null; renderList(); return; }
  const latest = [...S.groups.map((g) => ({ at: g.last?.created_at ?? "", view: { kind: "group", id: g.id } })),
    ...S.agents.map((a) => ({ at: a.last?.created_at ?? "", view: { kind: "agent", name: a.name } }))]
    .sort((x, y) => y.at.localeCompare(x.at))[0];
  open(latest?.view ?? { kind: "approvals" });
}

function renderHead() {
  const head = $("#chat-head"); head.replaceChildren();
  const v = S.view; if (!v) return;
  const back = h("button", { class: "icon-btn back", "aria-label": "Back to chats", onclick: () => { $("#app").classList.remove("in-chat"); S.view = null; renderList(); } },
    h("span", { "aria-hidden": "true", style: "font-size:22px" }, "‹"));
  if (v.kind === "agent") {
    const a = S.agents.find((x) => x.name === v.name); if (!a) return;
    const running = S.running.has(a.name);
    head.append(...[back, avatar(a.name, "", running),
      h("button", { class: "who", onclick: () => openDrawer(a.name), "aria-label": `${labelOf(a.name)} details` },
        h("div", { class: "title" }, labelOf(a.name)),
        h("div", { class: "sub" }, running ? `Working: ${S.progress[a.name] || "thinking"}` : `${a.enabled ? cronText(a.schedule) : "Disabled"}, ${modelLabel(a.model)}, ${EFFORT_LABEL[a.effort].toLowerCase()} effort`))].filter(Boolean));
  } else if (v.kind === "group") {
    const g = curGroup(); if (!g) return;
    const busy = g.members.filter((m) => S.running.has(m));
    head.append(back, groupAvatar(g),
      h("button", { class: "who", onclick: () => openGroupDrawer(g), "aria-label": `${g.name} details` },
        h("div", { class: "title" }, g.name),
        h("div", { class: "sub" }, busy.length ? `${busy[0]} is ${S.progress[busy[0]] || "thinking"}` : g.members.join(", "))));
  } else {
    head.append(back, h("div", { class: "who" }, h("div", { class: "title" }, "Approvals"), h("div", { class: "sub" }, "Agents can suggest changes. Nothing applies until you approve it.")));
  }
}

function fillSettings() {
  const a = S.agents.find((x) => x.name === S.view.name);
  const option = (m) => h("option", { value: m, selected: m === a.model }, modelLabel(m));
  // One group per provider; the agent's own model stays listed even if its provider isn't signed in.
  $("#model").replaceChildren(...S.models.includes(a.model) ? [] : [option(a.model)],
    ...S.modelGroups.map((g) => h("optgroup", { label: g.label }, ...g.models.map(option))));
  $("#effort").replaceChildren(...Object.entries(S.efforts).map(([e, t]) => h("option", { value: e, selected: e === a.effort }, `${EFFORT_LABEL[e]} (${t} turns)`)));
}

// ---------------- chat ----------------
function messageNode(m) {
  if (m.role === "system") return h("div", { class: "note" }, m.text);
  if (m.role === "local") return h("div", { class: "local" }, md(m.text), h("div", { class: "meta" }, "Only you can see this"));
  const mine = m.role === "human";
  const bubble = h("div", { class: `bubble${m.meta?.ok === false ? " failed" : ""}` });
  if (m.meta?.task) bubble.append(h("div", { class: "task" }, m.meta.scheduled ? "Scheduled task" : "Task run"));
  for (const a of m.attachments ?? []) bubble.append(h("a", { href: a.url, target: "_blank" }, h("img", { src: a.url, alt: "Attached photo", loading: "lazy" })));
  if (m.text) bubble.append(mine ? h("div", { class: "md" }, ...m.text.split("\n").flatMap((l, i) => i ? [h("br"), l] : [l])) : md(m.text));
  const how = !mine && m.meta?.model
    ? h("span", {}, `${modelLabel(m.meta.model)}, ${EFFORT_LABEL[m.meta.effort]?.toLowerCase() ?? m.meta.effort}${m.meta.turns ? `, ${m.meta.turns} turns` : ""}`) : null;
  bubble.append(h("div", { class: "meta" }, how, h("time", {}, timeOf(m.created_at))));
  const node = h("div", { class: `msg${mine ? " you" : ""}` }, mine ? null : avatar(m.author, "sm"), bubble);
  return m.proposals?.length ? [node, ...m.proposals.map(proposalCard)] : node;
}

function withDays(items, dateKey, render) {
  const nodes = []; let lastDay = null;
  for (const it of items) {
    const d = dayOf(it[dateKey]);
    if (d !== lastDay) { nodes.push(h("div", { class: "day" }, d)); lastDay = d; }
    nodes.push(...[render(it)].flat());
  }
  return nodes;
}

function renderMessages() {
  const stream = $("#stream");
  if (!S.messages.length && S.view.kind === "group") {
    stream.replaceChildren(h("div", { class: "empty" }, h("h2", {}, "Say hi to the group"),
      h("p", {}, `Everyone here gets every message you send and answers in turn: ${curGroup()?.members.join(", ")}.`)));
  } else if (!S.messages.length) {
    const a = S.agents.find((x) => x.name === S.view.name);
    stream.replaceChildren(h("div", { class: "empty" }, h("h2", {}, `Say hi to ${labelOf(a.name)}`),
      h("p", {}, a.description || "Ask it anything within its job."), a.schedule ? h("p", {}, `It also runs by itself: ${cronText(a.schedule).toLowerCase()}. Results land here.`) : null));
  } else stream.replaceChildren(...withDays(S.messages, "created_at", messageNode));
  renderTyping(); scrollDown();
}

function renderTyping() {
  $("#typing")?.remove();
  const name = S.view?.kind === "agent" ? S.view.name : null;
  const groupRunning = S.view?.kind === "group" ? (curGroup()?.members ?? []).filter((m) => S.running.has(m)) : [];
  const who = name && S.running.has(name) ? [name] : groupRunning;
  if (!who.length) return;
  $("#stream").append(h("div", { class: "typing", id: "typing", style: `--hue:${hueOf(who[0])}` },
    h("span", { class: "dots", "aria-hidden": "true" }, h("i"), h("i"), h("i")),
    who.map((n) => `${n} is ${S.progress[n] || "thinking"}`).join(", ")));
}
const scrollDown = () => { const s = $("#scroll"); s.scrollTop = s.scrollHeight; };

async function send() {
  const text = $("#text").value.trim();
  if (!text && !S.attachments.length) return;
  const v = S.view;
  closeSuggest();
  if (/^\/[a-z]/i.test(text)) return runCommand(text);
  $("#send").disabled = true;
  try {
    if (v.kind === "agent") {
      await api("POST", `/api/chats/${v.name}/messages`, {
        text, model: $("#model").value, effort: $("#effort").value, attachments: S.attachments.map((a) => a.path),
      });
      const a = S.agents.find((x) => x.name === v.name);
      a.model = $("#model").value; a.effort = $("#effort").value;
    } else if (v.kind === "group") {
      await api("POST", `/api/groups/${v.id}/messages`, { text });
    }
    $("#text").value = ""; S.attachments = []; renderAttachments(); autosize();
  } catch (e) { toast(e.message); }
  updateSend();
}

async function runNow() {
  try { await api("POST", `/api/agents/${S.view.name}/run`); } catch (e) { toast(e.message); }
}

// ---------------- slash commands ----------------
const COMMANDS = [
  { name: "help", desc: "List the commands you can use" },
  { name: "agents", desc: "List your agents and what they do" },
  { name: "approvals", desc: "Open the suggestions waiting for you" },
  { name: "new", desc: "Start a new conversation (the agent forgets this chat)", in: "agent" },

  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); return closeCmd(); }
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && n) {
    e.preventDefault(); S.palIndex = (S.palIndex + (e.key === "ArrowDown" ? 1 : -1) + n) % n; return renderPalette();
  }
  if (e.key === "Tab") { e.preventDefault(); if (n) paletteAct(S.palIndex, true); return; } // keeps focus in the box
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (n) paletteAct(S.palIndex); else toast(S.pal?.empty ?? "Type / to see the commands"); }
});
$("#cmd-list").addEventListener("mousedown", (e) => e.preventDefault()); // keep focus in the box
$("#cmd-scrim").addEventListener("click", () => closeCmd());

// ---------------- live updates ----------------
let es, refreshTimer;
const refreshSoon = () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(() => loadState().catch(() => {}), 400); };
function connect() {
  es?.close();
  es = new EventSource("/api/stream");
  es.addEventListener("message", (ev) => {
    const m = JSON.parse(ev.data);
    const here = (S.view?.kind === "agent" && m.chat === S.view.name) || (S.view?.kind === "group" && m.chat === `group:${S.view.id}`);
    if (here && !S.messages.some((x) => x.id === m.id)) {
      S.messages.push(m);
      if (m.role === "agent") delete S.progress[m.author];
      renderMessages();
    }
    refreshSoon();
  });
  es.addEventListener("progress", (ev) => {
    const p = JSON.parse(ev.data);
    if (p.type === "tool") S.progress[p.agent] = `using ${toolLabel(p.name.replace(/^mcp__(\w+)__/, "")).toLowerCase()}`;
    else S.progress[p.agent] = "writing";
    if ((S.view?.kind === "agent" && S.view.name === p.agent) || curGroup()?.members.includes(p.agent)) renderHead();
    renderTyping();
  });
  es.addEventListener("running", (ev) => {
    const r = JSON.parse(ev.data);
    if (r.running) { S.live.add(r.agent); S.running.add(r.agent); }
    else { S.live.delete(r.agent); S.running.delete(r.agent); delete S.progress[r.agent]; }
    renderList(); if (S.view?.kind === "agent" || S.view?.kind === "group") renderHead(); renderTyping();
  });
  es.addEventListener("event", (ev) => {
    const e = JSON.parse(ev.data);
    if ((e.action === "approve" || e.action === "reject") && e.details?.proposal) setProposalStatus(e.details.proposal, e.action === "approve" ? "approved" : "rejected");
    if (S.view?.kind === "approvals" && /propose|approve|reject/.test(e.action)) renderApprovals();
    // In the proposer's own chat the Approve/Reject buttons appear under its reply, so no toast there.
    const here = S.view?.kind === "agent" ? S.view.name === e.actor : !!curGroup()?.members.includes(e.actor);
    if (/^device-/.test(e.action)) {
      if (e.action === "device-verify") toast(`${e.details?.device} confirmed: it gets a notification whenever an agent finishes`);
      loadState().then(() => { if (devicesOpen()) openDevicesDrawer(); }).catch(() => {});
    }
    if (/propose-/.test(e.action) && !here) toast(`${e.actor} suggested ${e.action === "propose-create" ? "a new agent" : "a change"}. Open Approvals to review.`);
    refreshSoon();
  });
  es.onerror = () => { es.close(); setTimeout(() => api("GET", "/api/me").then(connect).catch(() => {}), 3000); };
}

// ---------------- composer behaviour ----------------
const autosize = () => { const t = $("#text"); t.style.height = "auto"; t.style.height = `${Math.min(t.scrollHeight, 180)}px`; };
const updateSend = () => { $("#send").disabled = !$("#text").value.trim() && !S.attachments.length; };
$("#text").addEventListener("input", (e) => {
  // A message starting with "/" is a command: move it into the floating command box.
  if (e.target.value.startsWith("/") && (S.view?.kind === "agent" || S.view?.kind === "group")) {
    const v = e.target.value; e.target.value = ""; autosize(); updateSend(); return openCmd(v, "chat");
  }
  autosize(); updateSend(); updateSuggest();
});
$("#text").addEventListener("keydown", (e) => {
  const s = S.sug;
  if (s && !e.isComposing) {
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && s.items.length) {
      e.preventDefault();
      s.index = (s.index + (e.key === "ArrowDown" ? 1 : -1) + s.items.length) % s.items.length;
      return renderSuggest();
    }
    if (((e.key === "Enter" && !e.shiftKey) || e.key === "Tab") && s.items.length) { e.preventDefault(); return pickSuggest(s.index, e.key === "Tab"); }
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); return closeSuggest(); }
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(pointer: fine)").matches) { e.preventDefault(); send(); }
});
$("#text").addEventListener("keyup", (e) => { if (/^(ArrowLeft|ArrowRight|Home|End)$/.test(e.key)) updateSuggest(); });
$("#text").addEventListener("click", updateSuggest);
$("#text").addEventListener("blur", closeSuggest);
$("#suggest").addEventListener("mousedown", (e) => e.preventDefault()); // keep focus in the message box
$("#send").addEventListener("click", send);
$("#attach").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
$("#text").addEventListener("paste", (e) => { const f = [...e.clipboardData.files].filter((x) => x.type.startsWith("image/")); if (f.length && S.view?.kind === "agent") { e.preventDefault(); addFiles(f); } });
$("#q").addEventListener("input", (e) => {
  if (e.target.value.startsWith("/")) { const v = e.target.value; e.target.value = S.filter = ""; renderList(); return openCmd(v); }
  S.filter = e.target.value; renderList();
});
$("#q").addEventListener("keydown", (e) => { if (e.key === "Escape" && e.target.value) { e.preventDefault(); e.stopPropagation(); e.target.value = S.filter = ""; renderList(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#drawer-root").replaceChildren(); });

// ---------------- boot ----------------
function showLogin() { $("#app").hidden = true; $("#login").hidden = false; es?.close(); setTimeout(() => $("#pw").focus(), 0); }
async function boot() {
  $("#login").hidden = true; $("#app").hidden = false;
  await loadState(); connect();
  await initPush().catch(() => {});
  openDefault(); openFromHash();
}
$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault(); $("#login-err").textContent = "";
  try { await api("POST", "/api/login", { password: $("#pw").value }); $("#pw").value = ""; boot(); }
  catch (err) { $("#login-err").textContent = err.message; }
});
$("#logout").addEventListener("click", async () => { await api("POST", "/api/logout").catch(() => {}); showLogin(); });
api("GET", "/api/me").then(boot).catch(() => showLogin());
</script>
