# A second stack for testing a checkout next to an existing install (e.g. on Docker Desktop).
# Container names and image tags all come from COMPOSE_PROJECT_NAME, so each checkout gets its own
# and never retags or replaces another install's. In a .env.<name> next to this file set:
#   COMPOSE_PROJECT_NAME=claude-agents-<name>
#   COMPOSE_FILE=compose.yaml:compose.build.yaml:compose.dev.yaml
#   DATA_DIR, UI_PORT, AGENTS_SUBNET, SHELL_SUBNET + LAN_GATEWAY_IP and BROWSER_LAN_SUBNET +
#   LAN_GATEWAY_BROWSER_IP + LAN_BROWSER_IP of its own
# then: docker compose --env-file .env.<name> up -d --build
#       docker exec -it claude-agents-<name> agents help
services:
  init:
    image: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}:local
  claude-agents:
    image: ${COMPOSE_PROJECT_NAME}:local
    container_name: ${COMPOSE_PROJECT_NAME}
  firewall:
    image: ${COMPOSE_PROJECT_NAME}-firewall:local
    container_name: ${COMPOSE_PROJECT_NAME}-firewall
  browser:
    container_name: ${COMPOSE_PROJECT_NAME}-browser
  vault:
    image: ${COMPOSE_PROJECT_NAME}:local
    container_name: ${COMPOSE_PROJECT_NAME}-vault
  shell:
    image: ${COMPOSE_PROJECT_NAME}:local
    container_name: ${COMPOSE_PROJECT_NAME}-shell
  lan:
    image: ${COMPOSE_PROJECT_NAME}:local
    container_name: ${COMPOSE_PROJECT_NAME}-lan
